name: Daily NIM Models Sync & Auto-Publish

on:
  schedule:
    - cron: '0 0 * * *' # Run at midnight UTC every day
  workflow_dispatch: # Allow manual triggers

jobs:
  update-models-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Needed to bypass branch protection if pushing
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx
          
      - name: Run Auto-Updater
        id: updater
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          python scripts/auto_updater.py > updater.log
          cat updater.log
          if grep -q "NO_CHANGES" updater.log; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and Push Changes
        if: steps.updater.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models.json setup.py vscode-extension/package.json
          git commit -F changelog.txt
          git push
          
      - name: Extract Version
        if: steps.updater.outputs.changes == 'true'
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'version=\"([^\"]+)\"', open('setup.py').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Create Release
        if: steps.updater.outputs.changes == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: changelog.txt
          
      - name: Build and Publish to PyPI
        if: steps.updater.outputs.changes == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install setuptools wheel twine
          python setup.py sdist bdist_wheel
          twine upload dist/*
          
      - name: Setup Node.js
        if: steps.updater.outputs.changes == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Publish VS Code Extension
        if: steps.updater.outputs.changes == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm install -g @vscode/vsce
          cd vscode-extension
          npm install
          npm run compile
          vsce publish -p $VSCE_PAT
